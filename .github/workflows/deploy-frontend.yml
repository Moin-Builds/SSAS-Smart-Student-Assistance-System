name: Deploy SSAS frontend

on:
  push:
    branches: [main, portfolio-deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure public backend URL
        env:
          AI_BACKEND_URL: ${{ vars.AI_BACKEND_URL }}
        run: |
          printf 'window.AI_BACKEND_URL = "%s";\n' "$AI_BACKEND_URL" > js/deployment-config.js

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
