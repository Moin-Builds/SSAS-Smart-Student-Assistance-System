<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SSAS | Smart Student Assistance System</title>
  <meta name="description" content="Login to SSAS — Smart Student Assistance System. Manage your schedule, resources, and academic performance.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

  <div class="auth-logo">
    <h1>🎓 SSAS</h1>
    <p>Smart Student Assistance System</p>
  </div>

  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="auth-subtitle">Sign in to your student account</p>

    <div id="loginAlert" class="alert error" style="display:none"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="auth-btn" id="loginBtn">Login</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Create Account</a>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // If already logged in, go straight to app
    redirectIfLoggedIn();

    document.getElementById('loginForm').addEventListener('submit', handleLogin);
  </script>
</body>
</html>
