<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a New Password — SSAS | Smart Student Assistance System</title>
  <meta name="description" content="Choose a new password for your SSAS account.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

  <div class="auth-logo">
    <h1>🎓 SSAS</h1>
    <p>Smart Student Assistance System</p>
  </div>

  <main class="auth-card">
    <h2>Choose a new password</h2>
    <p class="auth-subtitle">Create a new password for your SSAS account.</p>

    <div id="resetLinkStatus" class="alert info" role="status" aria-live="polite">Checking your recovery link…</div>
    <div id="passwordResetAlert" class="alert error" style="display:none" role="status" aria-live="polite"></div>

    <form id="passwordResetForm" hidden>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Min. 8 characters" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="form-group">
        <label for="confirmNewPassword">Confirm New Password</label>
        <input type="password" id="confirmNewPassword" placeholder="Enter your new password again" autocomplete="new-password" minlength="8" required>
      </div>

      <button type="submit" class="auth-btn" id="updatePasswordBtn">Update Password</button>
    </form>

    <div class="auth-footer">
      <a href="forgot-password.html">Request another reset link</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('passwordResetForm').addEventListener('submit', handlePasswordUpdate);
    initializePasswordReset();
  </script>
</body>
</html>
