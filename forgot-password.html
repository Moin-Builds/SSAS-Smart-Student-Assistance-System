<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SSAS | Smart Student Assistance System</title>
  <meta name="description" content="Request a secure password reset link for your SSAS account.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

  <div class="auth-logo">
    <h1>🎓 SSAS</h1>
    <p>Smart Student Assistance System</p>
  </div>

  <main class="auth-card">
    <h2>Reset your password</h2>
    <p class="auth-subtitle">Enter the email address associated with your account and we’ll send you a reset link.</p>

    <div id="forgotPasswordAlert" class="alert error" style="display:none" role="status" aria-live="polite"></div>

    <form id="forgotPasswordForm" novalidate>
      <div class="form-group">
        <label for="resetEmail">Email Address</label>
        <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <button type="submit" class="auth-btn" id="resetEmailBtn">Send Reset Link</button>
    </form>

    <div class="auth-footer">
      Remember your password? <a href="index.html">Back to Login</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', handlePasswordResetRequest);
  </script>
</body>
</html>
